<div id="pawport-setup" class="p-3 text-center">
  <h5>Pawport Credential Helper</h5>
  <p class="text-muted">Click below to log in and automatically find your Door ID.</p>
  <button id="login-btn" class="btn btn-primary">Login to Pawport</button>
</div>

<script>
  (async () => {
    const homebridge = window.homebridge;
    const loginBtn = document.getElementById('login-btn');

    loginBtn.onclick = async () => {
      // 1. Show a modal to get email/password
      const email = await homebridge.prompt('Enter Pawport Email');
      const password = await homebridge.prompt('Enter Pawport Password');

      if (!email || !password) return;

      homebridge.showSpinner();
      try {
        // 2. Call the server-side script (Step 3 below) to do the login
        const response = await homebridge.request('/get-creds', { email, password });
        
        homebridge.hideSpinner();
        
        // 3. Show the result to the user
        homebridge.toast.success('Found your Door ID!', 'Success');
        homebridge.showAlert(
          `Token: ${response.token}\nDoor ID: ${response.doors[0].id}`,
          'Copy these into the form below'
        );
      } catch (err) {
        homebridge.hideSpinner();
        homebridge.toast.error(err.message, 'Login Failed');
      }
    };
  })();
</script>
